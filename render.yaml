services:
  - type: web
    name: simplespace-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SPHEREX_COLLECTIONS
        value: spherex_dr1,spherex_qr3,spherex_dr1_deep,spherex_qr3_deep
  - type: web
    name: simplespace-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
